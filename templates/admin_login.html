<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SecureCom - Admin Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); width: 300px; }
        h2 { text-align: center; color: #111; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background: #e50914; color: white; border: none; padding: 10px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        button:hover { background: #b20710; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Admin Login</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="Username (admin)" required>
            <input type="password" name="password" placeholder="Password (securecom123)" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
