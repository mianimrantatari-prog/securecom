<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SecureCom - AI CCTV Security</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f9f9f9; }
        header { background: #111; color: white; padding: 20px; text-align: center; }
        .container { max-width: 1100px; margin: 30px auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 0 20px; }
        .card { background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); overflow: hidden; text-align: center; padding-bottom: 15px; }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card h3 { margin: 10px 0 5px; color: #111; }
        .card p { color: #666; font-size: 14px; }
        .price { color: #e50914; font-weight: bold; font-size: 18px; margin: 10px 0; }
        .btn { background: #25D366; color: white; padding: 8px 15px; text-decoration: none; border-radius: 4px; font-weight: bold; display: inline-block; }
        .out { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <h1>SecureCom - AI CCTV Security</h1>
        <p>High-End Corporate Identity & Security Equipment</p>
    </header>

    <div class="container">
        {% for product in products %}
        <div class="card">
            <img src="{{ url_for('static', filename='uploads/' + product.image) }}" alt="{{ product.name }}">
            <h3>{{ product.name }}</h3>
            <p>Category: {{ product.category }}</p>
            <div class="price">{{ product.price }} PKR</div>
            {% if product.stock > 0 %}
                <a class="btn" href="https://wa.me/92XXXXXXXXXX?text=I want to order {{ product.name }}" target="_blank">Order on WhatsApp</a>
            {% else %}
                <p class="out">Out of Stock</p>
            {% endif %}
        </div>
        {% endfor %}
    </div>
</body>
</html>
